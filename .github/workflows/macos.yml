name: macOS
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build script regression tests
        run: python3 -m unittest discover -s Tests/ScriptTests -v
      - name: Unit tests
        run: ./scripts/test.sh
      - name: Add source metadata to exercise clean packaging
        run: |
          xattr -wx com.apple.FinderInfo "$(printf '%064d' 1)" Resources/Info.plist
          xattr -w com.apple.ResourceFork 'packaging regression test' Resources/Info.plist
      - name: Package application
        run: ./scripts/build.sh
      - name: Report recognition languages
        run: |
          source scripts/build-paths.sh
          "$TRACKBOARD_APP_PATH/Contents/MacOS/Trackboard" --languages
      - name: Archive application
        run: |
          source scripts/build-paths.sh
          ditto -c -k --keepParent "$TRACKBOARD_APP_PATH" "$RUNNER_TEMP/Trackboard.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Trackboard-${{ matrix.os }}
          path: ${{ runner.temp }}/Trackboard.zip
