name: macOS
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Package application
        run: ./scripts/build.sh
      - name: Report recognition languages
        run: dist/Trackboard.app/Contents/MacOS/Trackboard --languages
      - name: Archive application
        run: ditto -c -k --keepParent dist/Trackboard.app dist/Trackboard.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Trackboard-${{ matrix.os }}
          path: dist/Trackboard.zip
